<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cultura Kids - Tablero</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');

        :root {
            --bg-app: #fcfaf8; /* Color crema del fondo */
            --primary-blue: #4a86f7;
            --primary-blue-shadow: #2e62c9;
            --text-dark: #334155;
            --text-light: #94a3b8;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #1c1c1e; /* Fondo oscuro exterior (como el navegador) */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Contenedor que simula la pantalla del teléfono */
        .phone-screen {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 850px;
            background-color: var(--bg-app);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* =========================================
           1. BARRA SUPERIOR (Avatares)
           ========================================= */
        .top-bar {
            display: flex;
            gap: 6px;
            padding: 15px 10px 10px 10px;
            overflow-x: auto;
            /* Ocultar scrollbar */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .top-bar::-webkit-scrollbar { display: none; }

        .player-badge {
            background: var(--white);
            border-radius: 20px;
            padding: 3px 8px 3px 3px;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            flex-shrink: 0;
            border: 2px solid transparent;
        }
        .player-badge.active { border-color: var(--primary-blue); }
        
        .avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1rem; }
        .p-info { display: flex; flex-direction: column; line-height: 1; }
        .p-name { font-size: 0.65rem; font-weight: 800; color: var(--text-dark); margin-bottom: 2px; }
        .p-stars { font-size: 0.55rem; font-weight: 800; color: var(--text-dark); display: flex; align-items: center; gap: 1px; }
        .p-stars span { color: #fbbf24; font-size: 0.6rem; }

        /* =========================================
           2. MAPA DEL TABLERO
           ========================================= */
        .map-container {
            flex: 1;
            margin: 0 10px;
            border-radius: 20px;
            position: relative;
            /* Usamos una imagen de stock que simula el mapa. 
               Puedes reemplazar esta URL por tu propia imagen generada. */
            background: url('https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?q=80&w=800&auto=format&fit=crop') center/cover no-repeat;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2), 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* Decoraciones del mapa (Simulando los carteles de la imagen) */
        .map-sign {
            position: absolute;
            top: 20px;
            left: 10px;
            background: #d4a373;
            color: #5c3a21;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: 900;
            font-size: 0.6rem;
            text-align: center;
            border: 2px solid #b5835a;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            transform: rotate(-5deg);
        }

        /* Fichas de los jugadores en el mapa */
        .map-token {
            position: absolute;
            width: 35px; height: 35px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem;
            transition: all 0.5s ease;
            z-index: 10;
        }

        /* =========================================
           3. LEYENDA DE ASIGNATURAS
           ========================================= */
        .subjects-legend {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: var(--bg-app);
        }
        .sub-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .sub-icon {
            width: 38px; height: 38px; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; font-size: 1.2rem;
            background: var(--white);
            box-shadow: 0 3px 6px rgba(0,0,0,0.08);
        }
        .sub-name { font-size: 0.55rem; font-weight: 800; color: var(--text-dark); }

        /* Colores de los iconos basados en tu imagen */
        .icon-math { color: #4a86f7; background: #ebf4ff; }
        .icon-lang { color: #f56565; background: #fff5f5; }
        .icon-eng { color: #9f7aea; background: #faf5ff; }
        .icon-music { color: #ecc94b; background: #fffff0; }
        .icon-sci { color: #48bb78; background: #f0fff4; }

        /* =========================================
           4. ÁREA DE CONTROL (Turno y Dado)
           ========================================= */
        .control-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px;
            background: var(--bg-app);
        }
        .turn-text {
            font-size: 1.1rem;
            font-weight: 900;
            color: #1e293b;
            margin-bottom: 15px;
            text-shadow: 0 1px 1px white;
        }

        /* Dado 3D CSS */
        .dice-wrapper {
            perspective: 1000px;
            width: 50px; height: 50px;
            margin-bottom: 15px;
        }
        .dice {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(-20deg); /* Ángulo inicial */
            transition: transform 1s ease-out;
        }
        .face {
            position: absolute; width: 50px; height: 50px;
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem; color: #333; font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        /* Caras del dado */
        .face-1 { transform: translateZ(25px); }
        .face-2 { transform: rotateX(90deg) translateZ(25px); }
        .face-3 { transform: rotateY(90deg) translateZ(25px); }
        .face-4 { transform: rotateY(-90deg) translateZ(25px); }
        .face-5 { transform: rotateX(-90deg) translateZ(25px); }
        .face-6 { transform: rotateY(180deg) translateZ(25px); }

        .btn-roll {
            background: var(--primary-blue);
            color: var(--white);
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 900;
            box-shadow: 0 4px 0 var(--primary-blue-shadow);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-roll:active { transform: translateY(4px); box-shadow: none; }

        /* =========================================
           5. MENÚ INFERIOR (Bottom Nav)
           ========================================= */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 12px 10px 25px 10px; /* Espacio extra abajo para el "home indicator" */
            background: var(--white);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -2px 15px rgba(0,0,0,0.05);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            font-size: 0.65rem; font-weight: 800; color: var(--text-light);
            cursor: pointer;
        }
        .nav-icon { font-size: 1.3rem; margin-bottom: 2px; filter: grayscale(1); opacity: 0.6; }
        
        .nav-item.active { color: var(--primary-blue); }
        .nav-item.active .nav-icon { filter: grayscale(0); opacity: 1; }

    </style>
</head>
<body>

    <div class="phone-screen">
        
        <!-- 1. BARRA SUPERIOR -->
        <div class="top-bar">
            <div class="player-badge active">
                <div class="avatar" style="background:#fbcfe8;">👧</div>
                <div class="p-info"><span class="p-name">Sofía</span><span class="p-stars"><span>⭐</span> 12</span></div>
            </div>
            <div class="player-badge">
                <div class="avatar" style="background:#bfdbfe;">👨</div>
                <div class="p-info"><span class="p-name">Papá</span><span class="p-stars"><span>⭐</span> 9</span></div>
            </div>
            <div class="player-badge">
                <div class="avatar" style="background:#fde68a;">👩</div>
                <div class="p-info"><span class="p-name">Mamá</span><span class="p-stars"><span>⭐</span> 10</span></div>
            </div>
            <div class="player-badge">
                <div class="avatar" style="background:#bbf7d0;">👵</div>
                <div class="p-info"><span class="p-name">Abuela</span><span class="p-stars"><span>⭐</span> 7</span></div>
            </div>
        </div>

        <!-- 2. MAPA -->
        <div class="map-container">
            <!-- Cartel de madera -->
            <div class="map-sign">APRENDE<br>JUEGA<br>CRECE</div>
            
            <!-- Simulando los avatares de los jugadores en sus casillas -->
            <!-- Nota: En el juego real, estas posiciones cambiarán con JS -->
            <div class="map-token" style="background:#fbcfe8; top: 65%; left: 25%;">👧</div>
            <div class="map-token" style="background:#bfdbfe; top: 50%; left: 35%;">👨</div>
            <div class="map-token" style="background:#fde68a; top: 45%; left: 65%;">👩</div>
            <div class="map-token" style="background:#bbf7d0; top: 55%; left: 75%;">👵</div>
        </div>

        <!-- 3. LEYENDA DE ASIGNATURAS -->
        <div class="subjects-legend">
            <div class="sub-item"><div class="sub-icon icon-math">🔢</div><span class="sub-name">Matemáticas</span></div>
            <div class="sub-item"><div class="sub-icon icon-lang">📖</div><span class="sub-name">Lenguaje</span></div>
            <div class="sub-item"><div class="sub-icon icon-eng">🇬🇧</div><span class="sub-name">Inglés</span></div>
            <div class="sub-item"><div class="sub-icon icon-music">🎵</div><span class="sub-name">Música</span></div>
            <div class="sub-item"><div class="sub-icon icon-sci">🌿</div><span class="sub-name">Ciencias</span></div>
        </div>

        <!-- 4. CONTROLES (Turno y Dado) -->
        <div class="control-area">
            <div class="turn-text">Turno de Sofía</div>
            
            <!-- Dado 3D -->
            <div class="dice-wrapper">
                <div class="dice" id="dice">
                    <div class="face face-1">•</div>
                    <div class="face face-2">••</div>
                    <div class="face face-3">•••</div>
                    <div class="face face-4">••••</div>
                    <div class="face face-5">•••••</div>
                    <div class="face face-6">••••••</div>
                </div>
            </div>

            <button class="btn-roll" onclick="rollDice()">¡Lanzar dado!</button>
        </div>

        <!-- 5. MENÚ INFERIOR -->
        <div class="bottom-nav">
            <div class="nav-item active"><div class="nav-icon">🗺️</div>Tablero</div>
            <div class="nav-item"><div class="nav-icon">👨‍👩‍👧‍👦</div>Familia</div>
            <div class="nav-item"><div class="nav-icon">📊</div>Asignaturas</div>
            <div class="nav-item"><div class="nav-icon">⭐</div>Álbum</div>
        </div>

    </div>

    <script>
        // Lógica simple para hacer que el dado gire al presionar el botón
        let isRolling = false;

        function rollDice() {
            if (isRolling) return;
            isRolling = true;
            
            const dice = document.getElementById('dice');
            
            // Generar un número aleatorio de 1 a 6
            const value = Math.floor(Math.random() * 6) + 1;
            
            // Mapear el número a la rotación de la cara correspondiente
            const rotations = {
                1: 'rotateX(0deg) rotateY(0deg)',
                2: 'rotateX(-90deg) rotateY(0deg)',
                3: 'rotateX(0deg) rotateY(-90deg)',
                4: 'rotateX(0deg) rotateY(90deg)',
                5: 'rotateX(90deg) rotateY(0deg)',
                6: 'rotateX(0deg) rotateY(180deg)'
            };
            
            // Añadir vueltas extra para efecto visual
            const spinX = (Math.floor(Math.random() * 3) + 3) * 360;
            const spinY = (Math.floor(Math.random() * 3) + 3) * 360;

            // Aplicar transformación
            dice.style.transform = `rotateX(${spinX}deg) rotateY(${spinY}deg)`;

            // Después de 1 segundo (cuando termina la animación), fijar la cara final
            setTimeout(() => {
                dice.style.transform = rotations[value];
                
                // Aquí iría la lógica para mover al jugador
                setTimeout(() => {
                    isRolling = false;
                    console.log("Salió un: " + value);
                    // alert("¡Salió un " + value + "! (Aquí moveríamos la ficha)");
                }, 1000);
            }, 500);
        }
    </script>
</body>
</html>
