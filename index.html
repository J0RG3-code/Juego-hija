<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aventura del Saber</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        :root {
            --bg-color: #e0f2fe;
            --primary: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --hint: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; touch-action: manipulation; }

        body {
            background-color: var(--bg-color);
            color: #1e293b;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png');
        }

        /* --- PANTALLAS --- */
        .screen { display: none; height: 100%; width: 100%; flex-direction: column; padding: 15px; }
        .screen.active { display: flex; }

        /* --- MENÚ PRINCIPAL --- */
        #setup-screen { justify-content: center; align-items: center; text-align: center; }
        h1 { font-size: 2.5rem; color: var(--primary); margin-bottom: 10px; text-shadow: 2px 2px 0px #fff; }
        .player-setup { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; width: 100%; max-width: 300px; }
        .player-input { display: flex; align-items: center; gap: 10px; }
        .player-input input { flex: 1; padding: 10px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 1rem; outline: none; }
        .player-input input:focus { border-color: var(--primary); }
        
        .btn {
            background-color: var(--primary); color: white; border: none; padding: 15px 20px;
            border-radius: 15px; font-size: 1.2rem; font-weight: 900; cursor: pointer;
            box-shadow: 0 4px 0 #1e3a8a; transition: transform 0.1s; width: 100%;
        }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-hint { background-color: var(--hint); box-shadow: 0 4px 0 #b45309; font-size: 1rem; padding: 10px; }

        /* --- TABLERO CON GRID CSS (CORREGIDO) --- */
        #board-screen { padding: 10px; justify-content: space-between; }
        .header { display: flex; justify-content: space-between; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 15px; font-weight: bold; font-size: 0.9rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .map-container { 
            flex: 1; 
            position: relative; 
            background: url('https://images.unsplash.com/photo-1506744626753-143d4e0ce508?q=80&w=1000&auto=format&fit=crop') center/cover; 
            border-radius: 20px; 
            margin: 10px 0; 
            border: 4px solid #fff; 
            overflow: hidden; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* El grid que contiene las casillas */
        .board-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 90%;
            height: 90%;
            padding: 10px;
        }

        .tile { 
            background: #fff; 
            border-radius: 12px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 1.2rem; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            position: relative;
            transition: all 0.3s;
        }
        .tile.math { background: #bfdbfe; } .tile.lang { background: #fecaca; } 
        .tile.eng { background: #e9d5ff; } .tile.sci { background: #bbf7d0; }
        .tile.goal { background: #fef08a; font-size: 2rem; }

        /* Fichas de jugadores */
        .token { 
            position: absolute; width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; 
            display: flex; justify-content: center; align-items: center; font-size: 0.8rem; font-weight: bold; 
            color: white; box-shadow: 0 3px 6px rgba(0,0,0,0.4); transition: all 0.4s ease-in-out; z-index: 20;
            bottom: 5px; right: 5px;
        }

        /* Controles inferiores */
        .controls { display: flex; gap: 10px; align-items: center; justify-content: center; background: white; padding: 15px; border-radius: 20px; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); }
        
        /* Dado 3D CSS */
        .dice-container { perspective: 1000px; width: 60px; height: 60px; }
        .dice { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 1s ease-out; }
        .face { position: absolute; width: 60px; height: 60px; background: white; border: 2px solid #ccc; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; }
        .front  { transform: translateZ(30px); } .back   { transform: rotateY(180deg) translateZ(30px); }
        .right  { transform: rotateY(90deg) translateZ(30px); } .left   { transform: rotateY(-90deg) translateZ(30px); }
        .top    { transform: rotateX(90deg) translateZ(30px); } .bottom { transform: rotateX(-90deg) translateZ(30px); }

        /* --- MODALES (Preguntas y Rompecabezas) --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; padding: 15px; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 20px; padding: 20px; width: 100%; max-width: 500px; text-align: center; max-height: 90vh; overflow-y: auto; }
        
        .subject-tag { background: #e2e8f0; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; display: inline-block; margin-bottom: 15px; }
        .question-text { font-size: 1.3rem; font-weight: bold; margin-bottom: 20px; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .option-btn { background: #f1f5f9; border: 2px solid #cbd5e1; padding: 15px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .option-btn:active { transform: scale(0.98); }
        
        .hint-box { display: none; background: #fef3c7; border: 2px dashed var(--hint); padding: 15px; border-radius: 15px; margin-top: 15px; font-size: 1rem; }
        .feedback { font-size: 1.2rem; font-weight: bold; margin-top: 15px; display: none; }

        /* Rompecabezas */
        #puzzle-container { display: flex; flex-direction: column; height: 100%; }
        #puzzle-workspace { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: #334155; border-radius: 10px; overflow: hidden; }
        #puzzle-board { position: relative; background: #e2e8f0; border: 2px solid #334155; display: grid; }
        .puzzle-piece { position: absolute; background-size: cover; border: 1px solid rgba(0,0,0,0.1); cursor: grab; transition: box-shadow 0.2s; }
        .puzzle-piece.placed { border: none; pointer-events: none; z-index: 1; }
        #puzzle-tray { position: absolute; bottom: 0; left: 0; width: 100%; height: 100px; background: rgba(0,0,0,0.6); display: flex; overflow-x: auto; padding: 10px; gap: 5px; }

        /* Animaciones */
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .shake { animation: shake 0.3s; }
    </style>
</head>
<body>

    <!-- 1. PANTALLA DE CONFIGURACIÓN -->
    <div id="setup-screen" class="screen active">
        <h1>Aventura del Saber</h1>
        <p>Arma tu equipo familiar</p>
        <div class="player-setup">
            <div class="player-input"><input type="text" id="p1" placeholder="Jugador 1 (Ej: Sofía)" maxlength="10"></div>
            <div class="player-input"><input type="text" id="p2" placeholder="Jugador 2 (Ej: Papá)" maxlength="10"></div>
            <div class="player-input"><input type="text" id="p3" placeholder="Jugador 3 (Opcional)" maxlength="10"></div>
        </div>
        <button class="btn" onclick="startGame()">¡Comenzar Aventura!</button>
    </div>

    <!-- 2. PANTALLA DEL TABLERO -->
    <div id="board-screen" class="screen">
        <div class="header">
            <span id="turn-display">Turno de: ...</span>
            <span id="stars-display">⭐ 0</span>
        </div>
        
        <div class="map-container" id="map-container">
            <div class="board-grid" id="board-grid"></div>
        </div>

        <div class="controls" id="controls">
            <div class="dice-container">
                <div class="dice" id="dice">
                    <div class="face front">1</div><div class="face back">6</div>
                    <div class="face right">3</div><div class="face left">4</div>
                    <div class="face top">5</div><div class="face bottom">2</div>
                </div>
            </div>
            <button class="btn" id="roll-btn" onclick="rollDice()" style="flex: 1;">¡Lanzar Dado!</button>
        </div>
    </div>

    <!-- 3. MODAL DE PREGUNTAS -->
    <div class="modal" id="question-modal">
        <div class="modal-content">
            <div class="subject-tag" id="q-subject">Matemáticas</div>
            <div class="question-text" id="q-text">Pregunta...</div>
            <div class="options-grid" id="q-options"></div>
            <div class="hint-box" id="q-hint"></div>
            <div class="feedback" id="q-feedback"></div>
            <button class="btn btn-hint" id="hint-btn" onclick="showHint()" style="margin-top: 15px;">💡 Pedir Pista</button>
            <button class="btn" id="continue-btn" onclick="closeQuestion()" style="display: none; margin-top: 15px; background-color: var(--success); box-shadow: 0 4px 0 #166534;">Continuar</button>
        </div>
    </div>

    <!-- 4. MODAL DE ROMPECABEZAS -->
    <div class="modal" id="puzzle-modal">
        <div class="modal-content" id="puzzle-container" style="padding: 0; background: #1e293b;">
            <div style="display: flex; justify-content: space-between; width: 100%; padding: 15px; color: white; background: #0f172a; border-radius: 20px 20px 0 0;">
                <span style="font-weight: bold; font-size: 1.2rem;">🧩 Rompecabezas</span>
                <span id="puzzle-progress">0%</span>
            </div>
            <div id="puzzle-workspace">
                <div id="puzzle-board"></div>
                <div id="puzzle-tray"></div>
            </div>
            <button class="btn" onclick="skipPuzzle()" style="margin: 15px; width: calc(100% - 30px); background: #64748b; box-shadow: 0 4px 0 #334155;">Rendirse (Saltar)</button>
        </div>
    </div>

    <script>
        // --- 1. BASE DE DATOS DE PREGUNTAS ---
        const allQuestions = [
            { id: 1, subject: 'Matemáticas', text: '¿Cuánto es 7 + 5?', options: ['10', '12', '11'], answer: 1, hint: 'Intenta contar desde el 7 hacia adelante: 8, 9, 10...' },
            { id: 2, subject: 'Matemáticas', text: 'Si tienes 15 manzanas y te comes 3, ¿cuántas quedan?', options: ['12', '13', '11'], answer: 0, hint: 'Resta: 15 - 3.' },
            { id: 3, subject: 'Lenguaje', text: '¿Cuál es el antónimo de "Feliz"?', options: ['Alegre', 'Triste', 'Contento'], answer: 1, hint: 'El antónimo es lo contrario.' },
            { id: 4, subject: 'Lenguaje', text: '¿Qué palabra está escrita correctamente?', options: ['Huevo', 'Guevo', 'Uevo'], answer: 0, hint: 'Las palabras con "hue" llevan H.' },
            { id: 5, subject: 'Inglés', text: '¿Cómo se dice "Perro" en inglés?', options: ['Cat', 'Dog', 'Bird'], answer: 1, hint: 'Suena como "Dog".' },
            { id: 6, subject: 'Ciencias', text: '¿Qué animal es el Pudú?', options: ['Un ave', 'Un ciervo', 'Un pez'], answer: 1, hint: 'Es un mamífero pequeño con cuernos, típico de Chile.' },
            { id: 7, subject: 'Matemáticas', text: '¿Cuántos lados tiene un triángulo?', options: ['4', '3', '5'], answer: 1, hint: 'El prefijo "tri" significa tres.' },
            { id: 8, subject: 'Música', text: '¿Qué instrumento tiene teclas blancas y negras?', options: ['Guitarra', 'Piano', 'Flauta'], answer: 1, hint: 'Es un instrumento grande que se toca con las dos manos.' }
        ];

        let availableQuestions = [...allQuestions];

        // --- 2. ESTADO DEL JUEGO ---
        let players = [];
        let currentPlayerIndex = 0;
        const BOARD_TILES = 15; // 4x4 grid approx
        let currentDiceValue = 0;
        let isMoving = false;
        let currentQuestionData = null;

        // --- 3. INICIALIZACIÓN ---
        function startGame() {
            const p1 = document.getElementById('p1').value || 'Jugador 1';
            const p2 = document.getElementById('p2').value || 'Jugador 2';
            const p3 = document.getElementById('p3').value;

            const colors = ['#ef4444', '#3b82f6', '#22c55e'];
            
            players = [
                { name: p1, pos: 0, color: colors[0], stars: 0 },
                { name: p2, pos: 0, color: colors[1], stars: 0 }
            ];
            if (p3) players.push({ name: p3, pos: 0, color: colors[2], stars: 0 });

            document.getElementById('setup-screen').classList.remove('active');
            document.getElementById('board-screen').classList.add('active');
            
            drawBoard();
            updateTurnUI();
        }

        // --- 4. LÓGICA DEL TABLERO (CORREGIDA CON GRID) ---
        function drawBoard() {
            const grid = document.getElementById('board-grid');
            grid.innerHTML = '';
            
            // Crear las 16 casillas (4x4)
            for (let i = 0; i < 16; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.id = `tile-${i}`;
                
                // Asignar asignaturas y meta
                const subjects = ['math', 'lang', 'sci', 'eng'];
                if (i === 15) {
                    tile.classList.add('goal');
                    tile.innerHTML = '🏆';
                } else {
                    tile.classList.add(subjects[i % 4]);
                    tile.innerHTML = '❓';
                }
                
                // Añadir fichas de jugadores si están en esta casilla
                players.forEach((p, index) => {
                    if (p.pos === i) {
                        const token = document.createElement('div');
                        token.className = 'token';
                        token.id = `token-${index}`;
                        token.style.backgroundColor = p.color;
                        token.innerText = p.name.charAt(0).toUpperCase();
                        tile.appendChild(token);
                    }
                });

                grid.appendChild(tile);
            }
        }

        function updateTurnUI() {
            const p = players[currentPlayerIndex];
            document.getElementById('turn-display').innerText = `Turno de: ${p.name}`;
            document.getElementById('turn-display').style.color = p.color;
            document.getElementById('stars-display').innerText = `⭐ ${p.stars}`;
            document.getElementById('roll-btn').disabled = false;
            isMoving = false;
        }

        // --- 5. LÓGICA DEL DADO 3D ---
        function rollDice() {
            if (isMoving) return;
            isMoving = true;
            document.getElementById('roll-btn').disabled = true;

            currentDiceValue = Math.floor(Math.random() * 6) + 1;
            
            const dice = document.getElementById('dice');
            const rotations = {
                1: 'rotateX(0deg) rotateY(0deg)',
                2: 'rotateX(-90deg) rotateY(0deg)',
                3: 'rotateX(0deg) rotateY(-90deg)',
                4: 'rotateX(0deg) rotateY(90deg)',
                5: 'rotateX(90deg) rotateY(0deg)',
                6: 'rotateX(0deg) rotateY(180deg)'
            };
            
            const spinX = (Math.floor(Math.random() * 4) + 4) * 360;
            const spinY = (Math.floor(Math.random() * 4) + 4) * 360;

            dice.style.transform = `rotateX(${spinX}deg) rotateY(${spinY}deg)`;

            setTimeout(() => {
                dice.style.transform = rotations[currentDiceValue];
                setTimeout(() => { movePlayer(currentDiceValue); }, 1000);
            }, 500);
        }

        // --- 6. MOVIMIENTO Y CASILLAS ---
        function movePlayer(steps) {
            const p = players[currentPlayerIndex];
            let targetPos = p.pos + steps;
            if (targetPos >= BOARD_TILES) targetPos = BOARD_TILES - 1; // 15 es la meta

            let currentStep = p.pos;
            const moveInterval = setInterval(() => {
                if (currentStep < targetPos) {
                    currentStep++;
                    p.pos = currentStep;
                    drawBoard(); // Redibujar el tablero para actualizar posiciones
                } else {
                    clearInterval(moveInterval);
                    checkTileAction();
                }
            }, 300);
        }

        function checkTileAction() {
            const p = players[currentPlayerIndex];
            
            if (p.pos === BOARD_TILES - 1) {
                setTimeout(() => {
                    alert(`¡${p.name} ha llegado a la meta! 🏆\nTotal de estrellas: ${p.stars}`);
                    location.reload();
                }, 500);
                return;
            }

            const action = Math.random();
            if (action < 0.7) {
                openQuestion();
            } else {
                openPuzzle();
            }
        }

        // --- 7. SISTEMA DE PREGUNTAS ---
        function getRandomQuestion() {
            if (availableQuestions.length === 0) availableQuestions = [...allQuestions];
            const randomIndex = Math.floor(Math.random() * availableQuestions.length);
            return availableQuestions.splice(randomIndex, 1)[0];
        }

        function openQuestion() {
            currentQuestionData = getRandomQuestion();
            const modal = document.getElementById('question-modal');
            
            document.getElementById('q-subject').innerText = currentQuestionData.subject;
            document.getElementById('q-text').innerText = currentQuestionData.text;
            
            const optionsContainer = document.getElementById('q-options');
            optionsContainer.innerHTML = '';
            
            currentQuestionData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('q-hint').style.display = 'none';
            document.getElementById('q-hint').innerText = currentQuestionData.hint;
            document.getElementById('hint-btn').style.display = 'block';
            document.getElementById('q-feedback').style.display = 'none';
            document.getElementById('continue-btn').style.display = 'none';
            
            modal.classList.add('active');
        }

        function checkAnswer(selectedIndex, btnElement) {
            const feedback = document.getElementById('q-feedback');
            const hintBtn = document.getElementById('hint-btn');
            
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

            if (selectedIndex === currentQuestionData.answer) {
                btnElement.style.backgroundColor = 'var(--success)';
                btnElement.style.color = 'white';
                feedback.innerText = '¡Excelente! 🎉';
                feedback.style.color = 'var(--success)';
                feedback.style.display = 'block';
                players[currentPlayerIndex].stars += 1;
            } else {
                btnElement.style.backgroundColor = 'var(--danger)';
                btnElement.style.color = 'white';
                document.querySelectorAll('.option-btn')[currentQuestionData.answer].style.backgroundColor = 'var(--success)';
                document.querySelectorAll('.option-btn')[currentQuestionData.answer].style.color = 'white';
                
                feedback.innerText = '¡Casi! Sigue intentando.';
                feedback.style.color = 'var(--danger)';
                feedback.style.display = 'block';
                
                document.querySelector('.modal-content').classList.add('shake');
                setTimeout(() => document.querySelector('.modal-content').classList.remove('shake'), 300);
            }

            hintBtn.style.display = 'none';
            document.getElementById('continue-btn').style.display = 'block';
        }

        function showHint() {
            document.getElementById('q-hint').style.display = 'block';
            document.getElementById('hint-btn').style.display = 'none';
        }

        function closeQuestion() {
            document.getElementById('question-modal').classList.remove('active');
            nextTurn();
        }

        // --- 8. MINIJUEGO: ROMPECABEZAS (CORREGIDO) ---
        let puzzlePiecesPlaced = 0;
        let totalPuzzlePieces = 0;

        function openPuzzle() {
            const modal = document.getElementById('puzzle-modal');
            const workspace = document.getElementById('puzzle-workspace');
            const board = document.getElementById('puzzle-board');
            const tray = document.getElementById('puzzle-tray');
            
            workspace.innerHTML = '';
            workspace.appendChild(board);
            workspace.appendChild(tray);
            board.innerHTML = '';
            tray.innerHTML = '';
            modal.classList.add('active');

            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            
            let cols, rows;
            if (screenWidth < 400) { cols = 6; rows = 8; } // 48 piezas (Móvil)
            else if (screenWidth < 800) { cols = 8; rows = 10; } // 80 piezas
            else { cols = 10; rows = 15; } // 150 piezas

            totalPuzzlePieces = cols * rows;
            puzzlePiecesPlaced = 0;
            document.getElementById('puzzle-progress').innerText = '0%';

            // Tamaño del tablero basado en el espacio disponible
            const boardSize = Math.min(screenWidth - 60, screenHeight - 250);
            const pieceW = boardSize / cols;
            const pieceH = boardSize / rows;

            board.style.width = `${boardSize}px`;
            board.style.height = `${boardSize}px`;
            board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            board.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

            // Imagen de respaldo (funciona offline o si falla la externa)
            const imgUrl = 'https://images.unsplash.com/photo-1564349683136-772a6956e902?q=80&w=600&auto=format&fit=crop';

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const piece = document.createElement('div');
                    piece.className = 'puzzle-piece';
                    piece.style.width = `${pieceW}px`;
                    piece.style.height = `${pieceH}px`;
                    
                    piece.style.backgroundImage = `url(${imgUrl})`;
                    piece.style.backgroundSize = `${boardSize}px ${boardSize}px`;
                    piece.style.backgroundPosition = `-${c * pieceW}px -${r * pieceH}px`;
                    
                    piece.dataset.targetX = c * pieceW;
                    piece.dataset.targetY = r * pieceH;
                    
                    piece.style.position = 'relative';
                    piece.style.margin = '2px';
                    piece.style.flexShrink = 0;

                    setupDragAndDrop(piece, board, tray, pieceW, pieceH);
                    tray.appendChild(piece);
                }
            }
        }

        function setupDragAndDrop(el, board, tray, w, h) {
            let isDragging = false;
            let startX, startY;
            let initialX, initialY;

            el.addEventListener('pointerdown', (e) => {
                if (el.classList.contains('placed')) return;
                isDragging = true;
                el.setPointerCapture(e.pointerId);
                
                const rect = el.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                initialX = rect.left;
                initialY = rect.top;

                el.style.zIndex = 1000;
                el.style.position = 'absolute';
                document.body.appendChild(el);
                el.style.left = `${initialX}px`;
                el.style.top = `${initialY}px`;
                el.style.margin = '0';
            });

            el.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                el.style.transform = `translate(${dx}px, ${dy}px)`;
            });

            el.addEventListener('pointerup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                el.style.transform = '';
                el.style.zIndex = '';

                const boardRect = board.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();

                const relativeX = elRect.left - boardRect.left;
                const relativeY = elRect.top - boardRect.top;

                const targetX = parseFloat(el.dataset.targetX);
                const targetY = parseFloat(el.dataset.targetY);

                const tolerance = 30;

                if (Math.abs(relativeX - targetX) < tolerance && Math.abs(relativeY - targetY) < tolerance) {
                    el.classList.add('placed');
                    board.appendChild(el);
                    el.style.left = `${targetX}px`;
                    el.style.top = `${targetY}px`;
                    el.style.position = 'absolute'; // Asegurar posición absoluta dentro del tablero
                    el.style.margin = '0';
                    puzzlePiecesPlaced++;
                    updatePuzzleProgress();
                } else {
                    tray.appendChild(el);
                    el.style.position = 'relative';
                    el.style.left = '';
                    el.style.top = '';
                    el.style.margin = '2px';
                }
            });
        }

        function updatePuzzleProgress() {
            const percent = Math.round((puzzlePiecesPlaced / totalPuzzlePieces) * 100);
            document.getElementById('puzzle-progress').innerText = `${percent}%`;

            if (puzzlePiecesPlaced === totalPuzzlePieces) {
                setTimeout(() => {
                    alert("¡Rompecabezas Completado! Ganaste 3 Estrellas ⭐⭐⭐");
                    players[currentPlayerIndex].stars += 3;
                    document.getElementById('puzzle-modal').classList.remove('active');
                    nextTurn();
                }, 300);
            }
        }

        function skipPuzzle() {
            document.getElementById('puzzle-modal').classList.remove('active');
            nextTurn();
        }

        // --- 9. CICLO DE TURNOS ---
        function nextTurn() {
            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            updateTurnUI();
            drawBoard();
        }

    </script>
</body>
</html>
