<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>La Aventura del Mapa Mágico</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --primary: #4A90E2;
      --secondary: #FF9F43;
      --success: #2ECC71;
      --bg: #F0F4F8;
      --card-bg: #FFFFFF;
    }
    * { box-sizing: border-box; font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif; user-select: none; }
    body { margin: 0; padding: 15px; background: var(--bg); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    h1 { color: #2C3E50; margin: 10px 0; font-size: 1.5rem; text-align: center; }
    
    .setup-screen, .game-screen { width: 100%; max-width: 500px; background: var(--card-bg); padding: 20px; border-radius: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
    .hidden { display: none !important; }
    
    button { background: var(--secondary); border: none; color: white; padding: 12px 20px; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: transform 0.1s; margin: 5px 0; width: 100%; }
    button:active { transform: scale(0.96); }
    .btn-alt { background: var(--primary); }
    .btn-hint { background: #F1C40F; color: #333; }
    .btn-joke { background: #9B59B6; color: white; }
    .btn-riddle { background: #E67E22; color: white; }

    .status-bar { display: flex; justify-content: space-between; background: #E1E8ED; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; font-weight: bold; font-size: 0.9rem; }

    .board-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 15px; }
    .cell { aspect-ratio: 1; background: #D5DBDB; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; position: relative; border: 2px solid #BDC3C7; text-align: center; }
    .cell.active { border-color: var(--secondary); background: #FFEAA7; }
    .cell.joke-cell { background: #E8DAEF; border-color: #8E44AD; }
    .cell.riddle-cell { background: #FDEBD0; border-color: #E67E22; }
    .player-token { width: 12px; height: 12px; border-radius: 50%; display: inline-block; position: absolute; bottom: 4px; }

    .card { background: #FFF; border: 3px solid var(--primary); border-radius: 15px; padding: 15px; text-align: center; margin-top: 10px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; color: white; font-size: 0.8rem; margin-bottom: 8px; text-transform: uppercase; }
    .badge-math { background: #E74C3C; }
    .badge-lang { background: #3498DB; }
    .badge-eng { background: #9B59B6; }
    .badge-sci { background: #2ECC71; }
    .badge-mus { background: #F39C12; }
    .badge-joke { background: #8E44AD; }
    .badge-riddle { background: #E67E22; }
    
    .options { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .opt-btn { background: #ECF0F1; color: #2C3E50; border: 2px solid #BDC3C7; text-align: left; padding: 10px 15px; border-radius: 8px; font-size: 0.95rem; }

    .feedback { margin-top: 10px; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; }
    .feedback.correct { background: #D4EDDA; color: #155724; }
    .feedback.retry { background: #FFF3CD; color: #856404; }
  </style>
</head>
<body>

  <h1>🗺️ La Aventura del Mapa Mágico</h1>

  <!-- Pantalla de Configuración Inicial -->
  <div id="setupScreen" class="setup-screen">
    <h3>¡Bienvenidos a la Aventura!</h3>
    <label><b>Selecciona el modo de juego:</b></label>
    <button onclick="startGame(1)">Un Jugador (Aventura)</button>
    <button class="btn-alt" onclick="startGame(2)">Modo Familiar (2 Jugadores)</button>
  </div>

  <!-- Pantalla Principal del Juego -->
  <div id="gameScreen" class="game-screen hidden">
    <div class="status-bar">
      <span id="turnInfo">Turno: Jugador 1</span>
      <span id="starsInfo">🌟 0</span>
    </div>

    <!-- Tablero de 15 Casillas -->
    <div class="board-container" id="board"></div>

    <button id="diceBtn" onclick="rollDice()">🎲 Lanzar Dado</button>

    <!-- Modal/Tarjeta de Preguntas, Chistes y Adivinanzas -->
    <div id="questionCard" class="card hidden">
      <span id="subjectBadge" class="badge">Materia</span>
      <p id="questionText" style="font-size: 1.1rem; font-weight: bold; margin: 10px 0;"></p>

      <!-- Sección Chistes -->
      <div id="jokeSection" class="hidden">
        <button class="btn-joke" onclick="speakText(currentText)">🔊 Escuchar Chiste</button>
        <button onclick="closeModal()" style="margin-top: 10px; background: var(--success);">¡Entendido y a reír! 😄</button>
      </div>

      <!-- Sección Adivinanzas y Preguntas -->
      <div id="quizSection">
        <button id="audioBtn" class="btn-alt" onclick="speakText(currentText)" style="margin-bottom: 10px;">🔊 Escuchar</button>
        <div id="optionsContainer" class="options"></div>
        <button class="btn-hint" onclick="showHint()" style="margin-top: 10px;">💡 Pedir una pista</button>
        <p id="hintText" style="font-style: italic; color: #7F8C8D; font-size: 0.85rem; display: none; margin-top: 5px;"></p>
        <div id="feedbackMsg" class="feedback hidden"></div>
      </div>
    </div>
  </div>

  <script>
    // Banco de Preguntas Escolares
    const questions = [
      { cat: 'math', badge: 'badge-math', name: 'Matemáticas', q: '¿Cuánto es 7 x 4?', opts: ['21', '28', '32'], a: 1, hint: 'Cuenta de 7 en 7 cuatro veces: 7, 14, 21...' },
      { cat: 'lang', badge: 'badge-lang', name: 'Lenguaje', q: '¿Cuál es el sinónimo de "Alegre"?', opts: ['Triste', 'Enojado', 'Contento'], a: 2, hint: 'Es una palabra que significa lo mismo que estar feliz.' },
      { cat: 'sci', badge: 'badge-sci', name: 'Ciencias', q: '¿Cuál es la flor nacional de Chile?', opts: ['Rosa', 'Copihue', 'Girasol'], a: 1, hint: 'Es una campanita roja que crece en los bosques del sur.' },
      { cat: 'eng', badge: 'badge-eng', name: 'Inglés', q: '¿Cómo se dice "Perro" en inglés?', opts: ['Cat', 'Dog', 'Rabbit'], a: 1, hint: 'Comienza con la letra D.' },
      { cat: 'mus', badge: 'badge-mus', name: 'Música', q: '¿Qué instrumento se toca con baquetas o palitos?', opts: ['Batería', 'Guitarra', 'Flauta'], a: 0, hint: 'Es un instrumento de percusión con platillos y tambores.' },
      { cat: 'math', badge: 'badge-math', name: 'Matemáticas', q: 'Si tienes 3 monedas de $100, ¿cuánto dinero tienes?', opts: ['$200', '$300', '$500'], a: 1, hint: 'Suma 100 + 100 + 100.' },
      { cat: 'sci', badge: 'badge-sci', name: 'Ciencias', q: '¿Qué animal vive en el sur de Chile y sale en el escudo nacional?', opts: ['Puma', 'Huemul', 'Zorro'], a: 1, hint: 'Es un ciervo o venadito nativo muy hermoso.' },
      { cat: 'lang', badge: 'badge-lang', name: 'Lenguaje', q: 'En la frase "El perro es rápido", ¿cuál es el adjetivo?', opts: ['El', 'Perro', 'Rápido'], a: 2, hint: 'El adjetivo nos dice CÓMO es el sustantivo.' }
    ];

    // Banco de Chistes
    const jokes = [
      "¿Qué le dice un gato a otro gato en la calle? ... ¡Miau! Y el otro le responde: ... ¡No me digas, yo también soy gato!",
      "¿Qué hace un perro con un taladro? ... ¡Ta-drando!",
      "¿Qué le dice una manzana verde a una manzana roja? ... ¡Uy, qué roja te pusiste! Y la roja responde: ¡Es que me dio vergüenza!",
      "¿Qué hace un pez en el agua? ... ¡Nada, absolutamente nada!",
      "¿Por qué el libro de matemáticas estaba triste? ... ¡Porque tenía demasiados problemas!",
      "¿Qué le dice un lápiz a un cuaderno? ... ¡Oye, siempre me estás siguiendo la línea!"
    ];

    // Banco de Adivinanzas
    const riddles = [
      { q: 'Tiene corteza pero no es árbol, tiene corazón pero no late, es dulce y roja... ¿Qué es?', opts: ['La Manzana', 'La Piedra', 'La Pelota'], a: 0, hint: 'Es una fruta muy saludable y crujiente.' },
      { q: 'Si me tiran al suelo no me rompo, pero si me tiran al agua me deshago... ¿Qué soy?', opts: ['El Papel', 'El Cristal', 'La Madera'], a: 0, hint: 'Sirve para escribir y dibujar sobre él.' },
      { q: 'Salgo por las mañanas y por la tarde me voy, doy luz y calorcito... ¿Quién soy?', opts: ['La Luna', 'El Sol', 'Un Farol'], a: 1, hint: 'Está al centro del sistema solar.' },
      { q: 'Tengo mina pero no soy minero, escribo en tu cuaderno y me gasto entero... ¿Qué soy?', opts: ['El Lápiz', 'El Borrador', 'El Pincel'], a: 0, hint: 'Si se le rompe la punta usas un sacapuntas.' },
      { q: 'Tengo hojas pero no soy árbol, tengo lomo pero no soy animal, te cuento mil historias... ¿Qué soy?', opts: ['El Libro', 'El Periódico', 'El Zapato'], a: 0, hint: 'Los encuentras en la biblioteca.' }
    ];

    let players = [];
    let currentPlayerIndex = 0;
    const totalCells = 15;
    const jokeCells = [3, 9];
    const riddleCells = [6, 12];
    let currentText = "";

    function startGame(numPlayers) {
      document.getElementById('setupScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');

      players = [];
      for (let i = 0; i < numPlayers; i++) {
        players.push({ id: i + 1, name: `Jugador ${i + 1}`, pos: 0, stars: 0, color: i === 0 ? '#E74C3C' : '#3498DB' });
      }

      buildBoard();
      updateStatus();
    }

    function buildBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let i = 0; i < totalCells; i++) {
        const cell = document.createElement('div');
        const isJoke = jokeCells.includes(i);
        const isRiddle = riddleCells.includes(i);
        
        cell.className = `cell ${i === 0 ? 'active' : ''} ${isJoke ? 'joke-cell' : ''} ${isRiddle ? 'riddle-cell' : ''}`;
        cell.id = `cell-${i}`;
        
        let cellLabel = i === 0 ? 'Inicio' : i === totalCells - 1 ? '🏆 Meta' : i;
        if (isJoke) cellLabel += ' 🤡';
        if (isRiddle) cellLabel += ' 🧙‍♂️';

        cell.innerHTML = `<span>${cellLabel}</span>`;
        boardEl.appendChild(cell);
      }
      renderTokens();
    }

    function renderTokens() {
      document.querySelectorAll('.player-token').forEach(el => el.remove());
      players.forEach(p => {
        const cell = document.getElementById(`cell-${p.pos}`);
        if (cell) {
          const token = document.createElement('span');
          token.className = 'player-token';
          token.style.background = p.color;
          token.style.left = `${(p.id * 12)}px`;
          cell.appendChild(token);
        }
      });
    }

    function updateStatus() {
      const p = players[currentPlayerIndex];
      document.getElementById('turnInfo').innerText = `Turno: ${p.name}`;
      document.getElementById('starsInfo').innerText = `🌟 ${p.stars}`;
    }

    function rollDice() {
      document.getElementById('diceBtn').disabled = true;
      const dice = Math.floor(Math.random() * 3) + 1;
      let p = players[currentPlayerIndex];
      p.pos = Math.min(p.pos + dice, totalCells - 1);
      renderTokens();

      setTimeout(() => {
        if (jokeCells.includes(p.pos)) {
          showJokeCard();
        } else if (riddleCells.includes(p.pos)) {
          showRiddleCard();
        } else {
          showQuestion();
        }
      }, 600);
    }

    function showJokeCard() {
      const card = document.getElementById('questionCard');
      const badge = document.getElementById('subjectBadge');
      
      badge.className = 'badge badge-joke';
      badge.innerText = '🤡 Momento de Risa';

      currentText = jokes[Math.floor(Math.random() * jokes.length)];
      document.getElementById('questionText').innerText = currentText;

      document.getElementById('jokeSection').classList.remove('hidden');
      document.getElementById('quizSection').classList.add('hidden');

      card.classList.remove('hidden');
    }

    function showRiddleCard() {
      const r = riddles[Math.floor(Math.random() * riddles.length)];
      setupQuizCard('badge badge-riddle', '🧙‍♂️ Adivinanza Mágica', r);
    }

    function showQuestion() {
      const q = questions[Math.floor(Math.random() * questions.length)];
      setupQuizCard(`badge ${q.badge}`, q.name, q);
    }

    function setupQuizCard(badgeClass, badgeName, item) {
      const card = document.getElementById('questionCard');
      const badge = document.getElementById('subjectBadge');
      
      badge.className = badgeClass;
      badge.innerText = badgeName;
      currentText = item.q;
      document.getElementById('questionText').innerText = item.q;
      document.getElementById('hintText').innerText = item.hint;
      document.getElementById('hintText').style.display = 'none';
      document.getElementById('feedbackMsg').className = 'feedback hidden';

      document.getElementById('jokeSection').classList.add('hidden');
      document.getElementById('quizSection').classList.remove('hidden');

      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';

      item.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx === item.a);
        optionsContainer.appendChild(btn);
      });

      card.classList.remove('hidden');
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-MX';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function showHint() {
      document.getElementById('hintText').style.display = 'block';
    }

    function checkAnswer(isCorrect) {
      const feedback = document.getElementById('feedbackMsg');
      feedback.classList.remove('hidden');

      if (isCorrect) {
        feedback.className = 'feedback correct';
        feedback.innerText = '¡Excelente trabajo! 🌟 +1 Estrella';
        players[currentPlayerIndex].stars += 1;
        
        setTimeout(() => {
          closeModal();
        }, 1500);
      } else {
        feedback.className = 'feedback retry';
        feedback.innerText = '¡Casi lo logras! Inténtalo otra vez o usa la pista 💡';
      }
    }

    function closeModal() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      document.getElementById('questionCard').classList.add('hidden');
      document.getElementById('diceBtn').disabled = false;
      nextTurn();
    }

    function nextTurn() {
      currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
      updateStatus();
    }
  </script>
</body>
</html>
